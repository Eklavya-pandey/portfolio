<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Contact — Naveen Kumar Pandey</title>
  <meta name="description" content="Get in touch with Naveen Kumar Pandey, Product Designer at Neo Wealth and Asset Management Pvt. Ltd. Open for product design inquiries, fintech collaborations, and consulting.">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Naveen Kumar Pandey",
    "jobTitle": "Product Designer",
    "worksFor": {
      "@type": "Organization",
      "name": "Neo Wealth and Asset Management Pvt. Ltd."
    },
    "url": "https://naveen.design/contact.html"
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Fira+Code:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Inter:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne+Mono&family=VT323&display=swap" rel="stylesheet">

  <!-- Critical Boot Loader Optimization & Skip Logic -->
  <script>
    (function(){
      try {
        var p = new URLSearchParams(window.location.search);
        var force = p.get('boot') === '1';
        var ut = p.get('theme');
        var st = localStorage.getItem('naveen_portfolio_theme');
        var theme = (ut || st || 'editorial').toLowerCase();
        var isWin98 = theme === 'windows98';
        var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = sessionStorage.getItem('nd_boot_seen') === '1';
        if ((seen && !force) || isWin98 || rm) {
          document.documentElement.classList.add('nd-boot-skip');
        }
      } catch(e) {
        document.documentElement.classList.add('nd-boot-skip');
      }
    })();
  </script>
  <style id="nd-boot-critical-css">
    #nd-boot-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999999;
      background-color: #E8E8E6;
      overflow: hidden;
    }
    .nd-boot-shutter {
      position: absolute;
      left: 0; right: 0; width: 100%; height: 50%;
      overflow: hidden; background-color: #E8E8E6;
    }
    .nd-boot-shutter-top { top: 0; }
    .nd-boot-shutter-bottom { top: 50%; }
    .nd-boot-stage {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    }
    .nd-boot-stage-bottom { top: -50vh; }
    .nd-boot-frame-wrap { position: relative; width: 100%; max-width: 640px; }
    .nd-boot-frame { position: relative; width: 100%; background: #E8E8E6; border-radius: 0; }
    html.nd-boot-skip #nd-boot-overlay,
    html.nd-boot-hidden #nd-boot-overlay {
      display: none !important;
    }
  </style>
  <noscript>
    <style>#nd-boot-overlay { display: none !important; }</style>
  </noscript>
</head>
<body>
  <!-- Blueprint Boot Loading Screen -->
  <div id="nd-boot-overlay" role="status" aria-label="Loading naveen.design">
    <div class="nd-boot-shutter nd-boot-shutter-top">
      <div class="nd-boot-stage">
        <div class="nd-boot-frame-wrap">
          <div class="nd-boot-frame">
            <svg class="nd-boot-frame-svg" viewBox="0 0 640 280" preserveAspectRatio="none">
              <rect class="nd-boot-frame-rect" x="1" y="1" width="638" height="278" rx="0" ry="0" pathLength="100"></rect>
            </svg>
            <div class="nd-boot-ticks" aria-hidden="true">
              <span class="nd-boot-tick nd-tick-tl">+</span>
              <span class="nd-boot-tick nd-tick-tr">+</span>
              <span class="nd-boot-tick nd-tick-bl">+</span>
              <span class="nd-boot-tick nd-tick-br">+</span>
            </div>
            <div class="nd-boot-header">
              <div class="nd-boot-header-left">
                <span class="nd-boot-logo-box"></span>
                <span class="nd-boot-header-title">naveen.design v2.6</span>
              </div>
              <div class="nd-boot-counter">000</div>
            </div>
            <div class="nd-boot-body">
              <div class="nd-boot-log"></div>
              <div class="nd-boot-progress-track">
                <div class="nd-boot-progress-fill"></div>
              </div>
              <div class="nd-boot-footer">
                <span class="nd-boot-skip-caption">PRESS ANY KEY OR CLICK TO SKIP</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="nd-boot-shutter nd-boot-shutter-bottom" aria-hidden="true">
      <div class="nd-boot-stage nd-boot-stage-bottom">
        <div class="nd-boot-frame-wrap">
          <div class="nd-boot-frame">
            <svg class="nd-boot-frame-svg" viewBox="0 0 640 280" preserveAspectRatio="none">
              <rect class="nd-boot-frame-rect" x="1" y="1" width="638" height="278" rx="0" ry="0" pathLength="100"></rect>
            </svg>
            <div class="nd-boot-ticks" aria-hidden="true">
              <span class="nd-boot-tick nd-tick-tl">+</span>
              <span class="nd-boot-tick nd-tick-tr">+</span>
              <span class="nd-boot-tick nd-tick-bl">+</span>
              <span class="nd-boot-tick nd-tick-br">+</span>
            </div>
            <div class="nd-boot-header">
              <div class="nd-boot-header-left">
                <span class="nd-boot-logo-box"></span>
                <span class="nd-boot-header-title">naveen.design v2.6</span>
              </div>
              <div class="nd-boot-counter">000</div>
            </div>
            <div class="nd-boot-body">
              <div class="nd-boot-log"></div>
              <div class="nd-boot-progress-track">
                <div class="nd-boot-progress-fill"></div>
              </div>
              <div class="nd-boot-footer">
                <span class="nd-boot-skip-caption">PRESS ANY KEY OR CLICK TO SKIP</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
